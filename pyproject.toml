[project]
name = "PlaySK-Piano-Roll-Reader"
version = "3.8.0"
description = "Optically reading a piano roll image, emulates expression and output midi signal in real-time."
authors = [{ name = "Katz Sasaki" }]
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    "wxPython @ https://github.com/wxWidgets/Phoenix/releases/download/4.3.0a16087%2B2cddce01/wxpython-4.3.0a16087+2cddce01-cp313-cp313-win_amd64.whl ; sys_platform == 'win32'",
    "wxPython @ https://github.com/wxWidgets/Phoenix/releases/download/4.3.0a16087%2B2cddce01/wxpython-4.3.0a16087+2cddce01-cp313-cp313-macosx_11_0_arm64.whl ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "wxPython @ https://github.com/wxWidgets/Phoenix/releases/download/4.3.0a16087%2B2cddce01/wxpython-4.3.0a16087+2cddce01-cp313-cp313-macosx_10_13_x86_64.whl ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "certifi>=2026.6.17",
    "mido>=1.3.3",
    "numpy>=2.4.6",
    "opencv-python-headless>=4.13.0.92",
    "pydantic>=2.13.4",
    "python-rtmidi>=1.5.8",
]

[project.urls]
Repository = "https://github.com/nai-kon/PlaySK-Piano-Roll-Reader"

[dependency-groups]
dev = [
    "cython>=3.2.5",
    "pip-licenses>=5.5.5",
    "pyinstaller>=6.21.0",
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.17",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
lint.select = ["E", "F", "B", "I", "COM", "A", "UP", "Q", "SIM", "W"]
lint.ignore = [
    "E402",
    "E501",
    "SIM300",
    "UP008",
    "B905"
]